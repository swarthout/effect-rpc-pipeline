name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["24.11.0", "24", "26"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/todoapp/package-lock.json
            examples/blogapp/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run examples:install
      - run: npm run examples:check
      - run: npm run pack:check
